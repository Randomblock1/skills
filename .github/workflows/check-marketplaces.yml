name: check-marketplaces

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify skills are registered in all marketplaces
        run: python3 scripts/check-marketplaces.py
      - name: Verify skill changes bump marketplace versions
        run: python3 scripts/check-versions.py
